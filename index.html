<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Транспорт Подмосковья — метро, МЦК, МЦД и проектируемые линии</title>
<meta name="description" content="Схема и карта транспорта Москвы и Подмосковья: метро, МЦК, МЦД D1–D4 и проектируемые линии. Поиск станций и построение маршрутов.">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <!-- ============================ ПАНЕЛЬ ============================ -->
  <aside class="sidebar" id="sidebar" aria-label="Поиск и построение маршрута">

    <div class="sheet-handle" id="sheetHandle" role="button" tabindex="0"
         aria-label="Развернуть или свернуть панель" aria-expanded="false">
      <span></span>
    </div>

    <header class="brand">
      <div class="brand__mark" aria-hidden="true">ТП</div>
      <div class="brand__text">
        <div class="brand__title">Транспорт Подмосковья</div>
        <div class="brand__sub">метро · МЦК · МЦД · проекты</div>
      </div>
    </header>

    <div class="side-scroll">
      <div class="search">
        <form class="search__field" role="search" onsubmit="return false">
          <svg class="search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path>
          </svg>
          <label class="sr-only" for="search">Поиск станции</label>
          <input id="search" type="search" placeholder="Станция, линия или город" autocomplete="off"
                 spellcheck="false" aria-controls="list" aria-expanded="false">
          <button class="search__clear hidden" id="searchClear" type="button" aria-label="Очистить поиск">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
          </button>
        </form>
        <ul class="results" id="list" role="listbox" aria-label="Результаты поиска"></ul>
      </div>

      <details class="section" id="routeSection">
        <summary class="section__head">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="6" cy="19" r="2.4"></circle><circle cx="18" cy="5" r="2.4"></circle><path d="M8.4 19h5.1a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h5.6"></path>
          </svg>
          Маршрут
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </summary>
        <div class="section__body">
          <div class="route-form">
            <div class="field field--from">
              <span class="field__pin" aria-hidden="true">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"></circle></svg>
              </span>
              <label class="sr-only" for="from">Откуда</label>
              <input id="from" type="text" placeholder="Откуда" list="stationNames" autocomplete="off" spellcheck="false">
            </div>
            <div class="field field--to">
              <span class="field__pin" aria-hidden="true">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.4a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8Z"></path></svg>
              </span>
              <label class="sr-only" for="to">Куда</label>
              <input id="to" type="text" placeholder="Куда" list="stationNames" autocomplete="off" spellcheck="false">
            </div>
            <button class="swap" id="swapBtn" type="button" title="Поменять местами">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <path d="M7 16V4m0 0L4 7m3-3 3 3M17 8v12m0 0 3-3m-3 3-3-3"></path>
              </svg>
              поменять местами
            </button>
            <button class="btn btn--primary btn--full" id="routeBtn" type="button">Построить маршрут</button>
          </div>
          <div class="route-result" id="route" aria-live="polite">
            <div class="route-empty">Выберите станции — время, пересадки и шаги поездки появятся здесь.</div>
          </div>
        </div>
      </details>

      <details class="section" id="layersSection" open>
        <summary class="section__head">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m12 3 9 5-9 5-9-5 9-5Z"></path><path d="m3 13 9 5 9-5"></path>
          </svg>
          Слои
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </summary>
        <div class="section__body">
          <div class="switches" id="switches">
            <label class="switch">
              <input type="checkbox" id="ly-metro" checked>
              <span class="switch__label">Московское метро<span class="switch__hint">15 линий</span></span>
              <span class="switch__track"></span>
            </label>
            <label class="switch">
              <input type="checkbox" id="ly-mcc" checked>
              <span class="switch__label">МЦК<span class="switch__hint">Московское центральное кольцо</span></span>
              <span class="switch__track"></span>
            </label>
            <label class="switch">
              <input type="checkbox" id="ly-mcd" checked>
              <span class="switch__label">МЦД D1–D4<span class="switch__hint">Московские центральные диаметры</span></span>
              <span class="switch__track"></span>
            </label>
            <label class="switch">
              <input type="checkbox" id="ly-project" checked>
              <span class="switch__label">Проектируемые линии<span class="switch__hint">15 линий в Подмосковье</span></span>
              <span class="switch__track"></span>
            </label>
            <label class="switch">
              <input type="checkbox" id="ly-labels" checked>
              <span class="switch__label">Подписи станций<span class="switch__hint">только на крупном масштабе</span></span>
              <span class="switch__track"></span>
            </label>
          </div>
        </div>
      </details>

      <details class="section" id="legendSection">
        <summary class="section__head">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h10"></path>
          </svg>
          Линии
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </summary>
        <div class="section__body" id="legend"></div>
      </details>
    </div>
  </aside>

  <!-- ============================ КАРТА ============================ -->
  <main class="viewport" id="viewport">
    <div id="map" aria-label="Карта транспорта"></div>

    <div class="scheme hidden" id="scheme" aria-label="Схема транспорта">
      <svg id="schemeSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Схема линий"></svg>
      <div class="scheme__legend" id="schemeLegend">
        <span><b>●</b> станция</span>
        <span><b>◉</b> пересадка</span>
        <span><b>①</b> номер линии на конце</span>
        <span><b>—</b> действующая линия</span>
        <span><b>– –</b> проектируемая</span>
        <span>колесо — масштаб, перетаскивание — сдвиг</span>
      </div>
      <div class="scheme-controls hidden" id="schemeControls">
        <button type="button" id="schemeZoomIn" aria-label="Приблизить">+</button>
        <button type="button" id="schemeZoomOut" aria-label="Отдалить">−</button>
        <button type="button" id="schemeReset" aria-label="Показать всю схему">⤢</button>
      </div>
    </div>

    <div class="topbar">
      <div class="segmented" role="group" aria-label="Режим отображения">
        <button class="segmented__btn" type="button" data-mode="geo" aria-pressed="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"></path>
          </svg>
          География
        </button>
        <button class="segmented__btn" type="button" data-mode="scheme" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 18 9 6l4 8 3-5 4 9"></path><circle cx="9" cy="6" r="1.6" fill="currentColor" stroke="none"></circle>
            <circle cx="16" cy="9" r="1.6" fill="currentColor" stroke="none"></circle>
          </svg>
          Схема
        </button>
      </div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="station-card hidden" id="stationCard" aria-live="polite">
      <div class="station-card__top">
        <div class="station-card__name" id="cardName"></div>
        <button class="station-card__close" id="cardClose" type="button" aria-label="Закрыть карточку">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div class="station-card__lines" id="cardLines"></div>
      <div class="station-card__meta" id="cardMeta"></div>
      <div class="station-card__actions">
        <button class="btn" id="cardFrom" type="button">Отсюда</button>
        <button class="btn" id="cardTo" type="button">Сюда</button>
      </div>
    </div>
  </main>
</div>

<datalist id="stationNames"></datalist>
<noscript>
  <p style="padding:20px">Для карты и поиска нужен JavaScript.</p>
</noscript>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
